name: "Feature request / 功能建议"
description: "Suggest a focused improvement / 说说你希望它解决什么问题"
title: "[Feature] "
labels:
  - enhancement
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Please explain the user problem before proposing an implementation.
        请先说明用户问题，再描述实现方案。

  - type: textarea
    id: problem
    attributes:
      label: "Problem / 问题"
      description: "Who is affected and when? / 谁在什么情况下受到影响？"
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: "Desired outcome / 你希望最后变成什么样"
    validations:
      required: true

  - type: textarea
    id: safety
    attributes:
      label: "Safety and recovery impact / 会不会影响权限、电源或恢复流程"
      description: "Consider privilege, battery, thermal, and rollback behavior / 请顺带考虑电量、散热和出错后的收尾"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives considered / 你还考虑过哪些做法"
