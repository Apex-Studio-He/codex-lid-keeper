name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and verify Universal DMG
        run: ./scripts/build_distribution.sh

      - name: Validate scripts and launchd files
        run: |
          for script in scripts/*.sh; do /bin/bash -n "$script"; done
          while IFS= read -r plist; do /usr/bin/plutil -lint "$plist"; done < <(find Resources -name '*.plist' -type f)
          git diff --check

      - name: Upload verified Alpha artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Codex-Lid-Keeper-v0.3.0-universal
          path: dist/releases/*
          if-no-files-found: error
