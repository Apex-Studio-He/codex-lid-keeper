name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: swift build -c release -Xswiftc -warnings-as-errors

      - name: Core self-tests
        run: swift run -c release --skip-build codex-lid-keeper-self-test

      - name: Hook configuration tests
        run: /usr/bin/python3 scripts/test_hooks_config.py

      - name: Dry-run lifecycle test
        run: /usr/bin/python3 scripts/test_e2e.py --binary .build/release/codex-lid-keeper

      - name: Build and verify macOS app
        run: |
          ./scripts/build_app.sh
          /usr/bin/codesign --verify --deep --strict "dist/Codex Lid Keeper.app"
          /usr/bin/plutil -lint "dist/Codex Lid Keeper.app/Contents/Info.plist"

      - name: Validate scripts and launchd files
        run: |
          for script in scripts/*.sh; do /bin/bash -n "$script"; done
          for plist in Resources/*.plist; do /usr/bin/plutil -lint "$plist"; done
          git diff --check
